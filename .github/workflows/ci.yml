name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The executable bit is not preserved on every checkout path (Windows clones,
      # patch-based imports), so normalise it rather than depend on file mode.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B clean verify

      # Uploaded even on failure: a red build is exactly when the reports are wanted.
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn

